
<h3>Détail de l'activité</h3>

@if (!editionEnCours) {
  <p>Activité sélectionnée : {{ titreActivite }}</p>
} @else {
  <p>Modifier le titre :</p>

  <input
    type="text"
    [(ngModel)]="nouveauTitre"
    class="champ-titre"
  >
}

<div class="actions">
  <button
    type="button"
    class="btn btn-supprimer"
    (click)="supprimeElem()">
    Supprimer
  </button>

  @if (!editionEnCours) {
    <button
      type="button"
      class="btn btn-modifier"
      (click)="modifierTitre()">
      Modifier
    </button>

    <button
      type="button"
      class="btn btn-retour"
      (click)="retourAccueil()">
      Retour
    </button>
  } @else {
    <button
      type="button"
      class="btn btn-modifier"
      (click)="enregistrerTitre()">
      Sauvegarder
    </button>
  }
</div>
